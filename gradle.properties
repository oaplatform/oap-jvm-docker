# docker image tag
version = 6
oap.jvm.version = 25

group = oap

# env REPOSITORY_URL overrides oap.docker.repository
oap.docker.repository = oap.xenoss.net
oap.docker.image = oap-jvm
oap.docker.platforms = linux/arm64,linux/amd64
# buildx builder (docker-container driver, created automatically)
oap.docker.builder = oap-jvm

# optional: pin apt package version instead of the latest one from apt.corretto.aws
#oap.corretto.package.version = 1:25.0.5.1.2-1

org.gradle.configuration-cache = true
